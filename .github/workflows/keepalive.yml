name: Keep the demo awake

on:
  schedule:
    # Streamlit Community Cloud puts apps to sleep after 12 hours without traffic.
    # Every 6 hours leaves a margin for GitHub starting scheduled runs late.
    - cron: "23 */6 * * *"
  workflow_dispatch:   # adds a "Run workflow" button for manual runs

permissions:
  actions: write   # for the "keep this schedule enabled" step
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://movie-recommender-billygeros.streamlit.app/

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Only this workflow needs a browser; the app's requirements.txt stays unchanged
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.64.1
          python -m playwright install --with-deps chromium

      - name: Open the app, waking it if asleep
        run: python .github/scripts/keepalive.py "$APP_URL"

      # GitHub switches off scheduled workflows after 60 days without repository
      # activity. Re-enabling this one through the API keeps its schedule running.
      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
